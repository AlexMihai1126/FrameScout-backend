services:
  framescout-api:
    build: .
    container_name: framescout-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://fs-db-user:fs-1234@mongodb:27017/framescout?authSource=admin
      - MONGO_DB=framescout
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/serviceAccountKey.json
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./serviceAccountKey.json:/app/secrets/serviceAccountKey.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
  
  mongodb:
    image: mongo:8.0.32
    environment:
      - MONGO_INITDB_DATABASE=framescout
      - MONGO_INITDB_ROOT_PASSWORD=fs-1234
      - MONGO_INITDB_ROOT_USERNAME=fs-db-user
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  
volumes:
  mongodb_data: